[project]
name = "ai-research-radar"
version = "1.0.0"
description = "Mapping the AI research landscape on arXiv with sentence embeddings: topic discovery, trend detection and semantic search."
readme = "README.md"
requires-python = "==3.12.*"
authors = [{ name = "Anas Khan" }]
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "sentence-transformers>=3.0",
    "plotly>=5.20",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "streamlit>=1.38",
    "pyarrow>=16",
    "jupyterlab>=4.2",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "adjusttext>=1.4.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
